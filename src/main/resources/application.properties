spring.application.name=event-intelligence-engine
server.port=9090

# AWS runtime profile
spring.profiles.active=aws,bedrock

# AWS configuration
app.aws.sqs.queue-url=${APP_AWS_SQS_QUEUE_URL}
app.aws.dynamodb.table-name=${APP_AWS_DYNAMODB_TABLE_NAME}

# Bedrock AI classifier configuration
app.aws.bedrock.model-id=${APP_AWS_BEDROCK_MODEL_ID}
app.ai.prompt-version=banking-classifier-v1
app.ai.classifier.max-tokens=300
app.ai.classifier.temperature=0

# Logging configuration
logging.level.root=WARN
logging.level.api=DEBUG
logging.level.application=INFO
logging.level.application.worker=INFO
logging.level.infra=INFO
logging.level.domain=DEBUG

# Structured logging format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

