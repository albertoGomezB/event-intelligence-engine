spring.application.name=event-intelligence-engine
server.port=8080

# AWS runtime profile
# spring.profiles.active=aws
app.aws.sqs.queue-url=
app.aws.dynamodb.table-name=event-intelligence-events

# Logging configuration
logging.level.root=WARN
logging.level.api=DEBUG
logging.level.application=INFO
logging.level.application.worker=INFO
logging.level.infra=INFO
logging.level.domain=DEBUG

# Structured logging format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

